name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: RemoveMetaData-windows-x64.exe
            rename: RemoveMetaData.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: RemoveMetaData-linux-x64
            rename: RemoveMetaData

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: RemoveMetaData-linux-arm64
            rename: RemoveMetaData
            cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: RemoveMetaData-macos-x64
            rename: RemoveMetaData

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: RemoveMetaData-macos-arm64
            rename: RemoveMetaData

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (ARM64 Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release -p removemetadata-cli -p removemetadata-gui

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p removemetadata-cli

      - name: Rename artifacts
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.artifact }}" == *.exe ]]; then EXT=".exe"; else EXT=""; fi
          mv "$SRC/RemoveMetaData${EXT}" "${{ matrix.artifact }}"
          if [ "${{ matrix.cross }}" != "true" ] && [ -f "$SRC/RemoveMetaData-GUI${EXT}" ]; then
            mv "$SRC/RemoveMetaData-GUI${EXT}" "${{ matrix.artifact }}-GUI${EXT}"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-cli
          path: ${{ matrix.artifact }}

      - name: Upload GUI artifact
        if: "!matrix.cross"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-gui
          path: ${{ matrix.artifact }}-GUI*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RemoveMetaData ${{ steps.tag.outputs.tag }}
          body: |
            ## RemoveMetaData ${{ steps.tag.outputs.tag }}

            Remove AI metadata (ChatGPT, DALL-E, Midjourney, C2PA, etc.) from images, documents, video, and audio.
            Built in Rust — no Python required.

            ### Downloads
            | Platform | CLI | GUI |
            |----------|-----|-----|
            | Windows x64 | `RemoveMetaData-windows-x64.exe` | `RemoveMetaData-windows-x64-GUI.exe` |
            | Linux x64 | `RemoveMetaData-linux-x64` | `RemoveMetaData-linux-x64-GUI` |
            | Linux ARM64 | `RemoveMetaData-linux-arm64` | — |
            | macOS x64 | `RemoveMetaData-macos-x64` | `RemoveMetaData-macos-x64-GUI` |
            | macOS ARM64 | `RemoveMetaData-macos-arm64` | `RemoveMetaData-macos-arm64-GUI` |

            ### Usage
            ```bash
            # GUI mode (default)
            ./RemoveMetaData

            # CLI mode
            ./RemoveMetaData --cli ./images -o ./output
            ```
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
